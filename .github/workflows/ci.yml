name: ci
on:
  pull_request:
  push:
    branches: [develop]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sharelo
          POSTGRES_PASSWORD: sharelo
          POSTGRES_DB: sharelo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sharelo -d sharelo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://sharelo:sharelo@localhost:5432/sharelo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make install
      - run: make lint
      - run: make test
