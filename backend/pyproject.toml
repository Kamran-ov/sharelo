[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sharelo.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
# whitenoise warns when STATIC_ROOT is not collected yet; only the container build collects it.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
